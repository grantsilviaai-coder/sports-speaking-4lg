function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function ing(en){ // "play tennis" -> "playing tennis"
  const [v,...rest]=en.split(' ');
  const m={play:'playing',swim:'swimming',run:'running',ride:'riding',go:'going',do:'doing',surf:'surfing',skateboard:'skateboarding'};
  return [(m[v]||v+'ing'),...rest].join(' ');
}

/* ---------- Level 2: sentence-pattern items ---------- */
function buildPatterns(){
  const P=[];
  // ❶ 喜歡什麼運動
  const like = {id:'like', name:'❶ 喜歡什麼運動', items:[]};
  ['lanqiu','youyong','zuqiu'].forEach(id=>{const s=SP[id];
    like.items.push({id:'like-'+id, q:[W('你','nǐ'),W('喜歡','xǐhuan'),W('什麼','shénme'),W('運動','yùndòng'),Q], qen:'What sport do you like?',
      cue:{e:s.e, tk:[st(s)], en:s.en}, frame:[W('我','wǒ'),W('喜歡','xǐhuan'),'_',D],
      a:[W('我','wǒ'),W('喜歡','xǐhuan'),st(s),D], aen:`I like ${ing(s.en)}.`});
  });
  {const a=SP.paobu,b=SP.youyong;
    like.items.push({id:'like-two', q:[W('他','tā'),W('喜歡','xǐhuan'),W('什麼','shénme'),W('運動','yùndòng'),Q], qen:'What sport does he like?',
      cue:{e:'👦 '+a.e+' '+b.e, tk:[st(a),W('、','、'),st(b)], en:a.en+', '+b.en}, frame:[W('他','tā'),W('喜歡','xǐhuan'),'_',C,W('也','yě'),W('喜歡','xǐhuan'),'_',D],
      a:[W('他','tā'),W('喜歡','xǐhuan'),st(a),C,W('也','yě'),W('喜歡','xǐhuan'),st(b),D], aen:`He likes running, and he also likes swimming.`});}
  P.push(like);

  // ❷ 會不會
  const can = {id:'can', name:'❷ 你會…嗎？', items:[]};
  [['chonglang','butai'],['jiaotache','henhui'],['ticao','buhui']].forEach(([id,d])=>{const s=SP[id],g=DEG_CAN[d];
    can.items.push({id:'can-'+id, q:[W('你','nǐ'),W('會','huì'),st(s),W('嗎','ma'),Q], qen:`Can you ${s.en}?`,
      cue:{e:s.e+' '+g.e, tk:[g.label], en:g.en}, frame:[W('我','wǒ'),'_',st(s),D],
      a:[W('我','wǒ'),...g.tk,st(s),D], aen:`I ${g.en==='can'?'can':g.en==='cannot'?'cannot':'am '+g.en} ${s.en}.`});
  });
  P.push(can);

  // ❸ V得怎麼樣
  const well = {id:'well', name:'❸ …得怎麼樣？', items:[]};
  [['youyong','bucuo'],['wangqiu','lihai'],['paobu','kuai']].forEach(([id,d])=>{const s=SP[id],g=DEG_WELL[d];
    const vde=W(s.v[0]+'得', s.v[1]+' de');
    well.items.push({id:'well-'+id, q:[W('你','nǐ'),st(s),vde,W('怎麼樣','zěnmeyàng'),Q], qen:`How well do you ${s.en}?`,
      cue:{e:s.e+' '+g.e, tk:g.tk, en:g.en}, frame:[W('我','wǒ'),st(s),vde,'_',D],
      a:[W('我','wǒ'),st(s),vde,...g.tk,D], aen:`I ${s.en} ${g.en}.`});
  });
  P.push(well);

  // ❹ 覺得
  const feel = {id:'feel', name:'❹ 我覺得…', items:[]};
  [['wangqiu','nan'],['huaban','yisi'],['paobu','qingsong']].forEach(([id,d])=>{const s=SP[id],g=FEEL_ADJ[d];
    feel.items.push({id:'feel-'+id, q:[W('你','nǐ'),W('覺得','juéde'),st(s),W('怎麼樣','zěnmeyàng'),Q], qen:`What do you think of ${ing(s.en)}?`,
      cue:{e:s.e+' '+g.e, tk:g.tk, en:g.en}, frame:[W('我','wǒ'),W('覺得','juéde'),st(s),'_',D],
      a:[W('我','wǒ'),W('覺得','juéde'),st(s),...g.tk,D], aen:`I think ${ing(s.en)} ${g.en}.`});
  });
  P.push(feel);

  // ❺ 因為
  const why = {id:'why', name:'❺ 為什麼？因為…', items:[]};
  [['lanqiu','youqu'],['pashan','qingsong']].forEach(([id,d])=>{const s=SP[id],g=FEEL_ADJ[d];
    why.items.push({id:'why-'+id, q:[W('你','nǐ'),W('為什麼','wèishénme'),W('喜歡','xǐhuan'),st(s),Q], qen:`Why do you like ${ing(s.en)}?`,
      cue:{e:s.e+' '+g.e, tk:g.tk, en:g.en}, frame:[W('我','wǒ'),W('喜歡','xǐhuan'),st(s),C,W('因為','yīnwèi'),st(s),'_',D],
      a:[W('我','wǒ'),W('喜歡','xǐhuan'),st(s),C,W('因為','yīnwèi'),st(s),...g.tk,D], aen:`I like ${ing(s.en)} because it ${g.en.replace('is ','is ')}.`});
  });
  P.push(why);

  // ❻ 邀請 一起
  const inv = {id:'invite', name:'❻ 邀請朋友', items:[]};
  ['zuqiu','pingpang'].forEach(id=>{const s=SP[id];
    inv.items.push({id:'inv-'+id, q:[W('邀請','yāoqǐng'),W('朋友','péngyou'),W('一起','yìqǐ'),st(s),X], qen:`Invite your friend to ${s.en} together!`,
      cue:{e:'🧑‍🤝‍🧑 '+s.e, tk:[W('一起','yìqǐ'),st(s)], en:'together'}, frame:[W('我們','wǒmen'),W('一起','yìqǐ'),W('去','qù'),'_',C,W('好不好','hǎo bù hǎo'),Q],
      a:[W('我們','wǒmen'),W('一起','yìqǐ'),W('去','qù'),st(s),C,W('好不好','hǎo bù hǎo'),Q], aen:`Let's go ${ing(s.en)} together, OK?`});
  });
  P.push(inv);

  // ❼ 都 (L2)
  const dou = {id:'dou', name:'❼ 都 (L2)', items:[]};
  [['妹妹','mèimei','👧','my younger sister','yumao'],['哥哥','gēge','👦','my older brother','bangqiu']].forEach(([h,p,e,en,id])=>{const s=SP[id];
    dou.items.push({id:'dou-'+id, q:[W('你','nǐ'),W('和','hé'),W(h,p),W('喜歡','xǐhuan'),W('什麼','shénme'),W('運動','yùndòng'),Q], qen:`What sport do you and ${en} like?`,
      cue:{e:'🙋 '+e+' ❤️ '+s.e, tk:[W('都','dōu'),st(s)], en:'both'}, frame:[W('我','wǒ'),W('和','hé'),W(h,p),'_',W('喜歡','xǐhuan'),'_',D],
      a:[W('我','wǒ'),W('和','hé'),W(h,p),W('都','dōu'),W('喜歡','xǐhuan'),st(s),D], aen:`${cap(en)} and I both like ${ing(s.en)}.`});
  });
  P.push(dou);

  // ❽ 一樣 (L2)
  const yy = {id:'yiyang', name:'❽ 一樣 (L2)', items:[]};
  [['哥哥','gēge','my older brother','高','gāo','tall','🙋📏👦'],['他','tā','him','厲害','lìhai','awesome','🙋💪👦']].forEach(([h,p,en,ah,ap,aen,e],i)=>{
    yy.items.push({id:'yy-'+i, q:[W('用','yòng'),W('「一樣」','「yíyàng」'),W('說一說','shuō yì shuō'),X], qen:'Say it with 一樣 (the same).',
      cue:{e, tk:[W(ah,ap)], en:aen}, frame:[W('我','wǒ'),W('和','hé'),W(h,p),'_',D],
      a:[W('我','wǒ'),W('和','hé'),W(h,p),W('一樣','yíyàng'),W(ah,ap),D], aen:`I am as ${aen} as ${en}.`});
  });
  P.push(yy);
  return P;
}

function scoreQ(q, said){
  said = fixHomo(said, S_txt(q.model)+q.kw.flat().join(''));
  const t=norm(said); if(!t) return 0;
  const hits=q.kw.filter(g=>g.some(a=>t.includes(norm(a)))).length;
  let sc=Math.round(100*hits/q.kw.length);
  if (q.type==='you' && [...t].length<6) sc=Math.min(sc,60);
  if ([...t].length<2) sc=Math.min(sc,30);
  return sc;
}

/* ---------- 老師／名字 ---------- */
function cleanName(n){
  let s=String(n||'').normalize('NFKC').trim().replace(/\s+/g,' ').replace(/([\u3400-\u9fff])\s+(?=[\u3400-\u9fff])/g,'$1').replace(/[「」『』'＇"“”]+/g,'').replace(/[\p{Extended_Pictographic}\u2600-\u27BF\uFE0F\u200D♡♥❤]/gu,'').replace(/\s*[+＋]\s*(heart)?\s*$/i,'').trim();
  const al=(CONFIG.NAME_ALIASES||{})[s.toLowerCase()]; if(al) s=al;
  // 英文名字：每個字的第一個字母大寫（alyvia → Alyvia），大小寫不同的紀錄會合在一起
  return s.replace(/(^|[\s\-])([a-z])/g,(m,a,c)=>a+c.toUpperCase());
}
function nameKey(n){ return cleanName(n).toLowerCase(); }
/* 顯示用：有名單的學生顯示「中文名字 英文名字」 */
function dispName(n){ const c=cleanName(n); for(const L of Object.values(CONFIG.ROSTER||{})){ const r=L.find(x=>nameKey(x[1])===nameKey(c)); if(r) return (r[0]?r[0]+' ':'')+r[1]; } return c; }
function teacherOf(r){ return String(r.teacher||'') || CONFIG.LEGACY_TEACHER || ''; }
function normCls(r){ if(!r) return r; const c=String(r.cls==null?'':r.cls); if((CONFIG.LEGACY_CLASSES||[]).includes(c)){ const t=(CONFIG.TEACHERS||[]).find(x=>x.name===teacherOf(r)); if(t&&t.classes.length===1) r.cls=t.classes[0]; } return r; }
function migrateCase(u){ try{ ['sp_prog_','sp_ts_','sp_l6_','sp_l7_','sp_l8_','sp_lb_','sp_lc_'].forEach(p=>{ const nk=p+(u.teacher||'')+'_'+(u.cls||'')+'_'+u.name; if(localStorage.getItem(nk)!=null) return;
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k!==nk && k.startsWith(p) && nameKey(k.slice(k.lastIndexOf('_')+1))===nameKey(u.name) && k.slice(0,k.lastIndexOf('_'))===nk.slice(0,nk.lastIndexOf('_'))){ localStorage.setItem(nk, localStorage.getItem(k)); break; } } }); }catch(e){} }

/* ---------- microphone + speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micStream=null, current=null;
const VIRTUAL_MIC = /eshare|sharing audio|virtual|stereo mix|立體聲混音|cable|voicemeeter|obs|loopback|teams audio|zoom audio/i;
let micLabel='';
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const DEVICE = IS_IOS ? (/iPhone/.test(navigator.userAgent)?'iPhone':'iPad') : /CrOS/.test(navigator.userAgent)?'Chromebook' : /Android/.test(navigator.userAgent)?'Android' : /Windows/.test(navigator.userAgent)?'Windows' : /Mac/.test(navigator.userAgent)?'Mac' : 'other';
const BROWSER = /CriOS|Chrome/.test(navigator.userAgent)?'Chrome' : /Safari/.test(navigator.userAgent)?'Safari' : /Firefox|FxiOS/.test(navigator.userAgent)?'Firefox' : 'other';
/** 每次都開一個新的麥克風，用完就關掉（iPad 上重複使用舊的麥克風，播放朗讀後會變成沒有聲音） */
async function getMic(){
  const base={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  let s = await navigator.mediaDevices.getUserMedia({audio:base});
  micLabel = s.getAudioTracks()[0]?.label || '';
  if (VIRTUAL_MIC.test(micLabel)){
    try{
      const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput' && d.label && !VIRTUAL_MIC.test(d.label) && !/^communications/i.test(d.label));
      const pick = devs.find(d=>/^default/i.test(d.label)) || devs[0];
      if (pick){
        const s2 = await navigator.mediaDevices.getUserMedia({audio:{...base, deviceId:{exact:pick.deviceId}}});
        s.getTracks().forEach(t=>t.stop());
        s = s2; micLabel = pick.label; state.virtualMic = true;
      }
    }catch(e){}
  }
  micStream = s;
  return s;
}
function releaseMic(s){ try{ (s||micStream)?.getTracks().forEach(t=>t.stop()) }catch(e){} if(!s || s===micStream) micStream=null; }
let actx=null;
function audioCtx(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){ actx=null } return actx; }
/** 測 3 秒音量，回傳 0~1 的最大值 */
async function micPeak(ms=3000, onLevel){
  const s=await getMic(); const ac=audioCtx();
  let peak=0;
  try{
    const src=ac.createMediaStreamSource(s), an=ac.createAnalyser(); src.connect(an);
    const buf=new Float32Array(an.fftSize); const t0=Date.now();
    while(Date.now()-t0<ms){ an.getFloatTimeDomainData(buf); let cur=0; for(const v of buf) cur=Math.max(cur,Math.abs(v)); peak=Math.max(peak,cur); onLevel&&onLevel(cur); await new Promise(r=>setTimeout(r,60)); }
    src.disconnect();
  } finally { releaseMic(s); }
  return peak;
}
const MIC_FIX_HTML = `<b>語音辨識可能用到了錯誤的麥克風。</b>請在 Chrome 網址列輸入 <code>chrome://settings/content/microphone</code>，在最上面的下拉選單選「真正的麥克風」（例如 <i>Microphone Array</i> 或耳機麥克風），<b>不要選 EShare / Sharing Audio</b>，然後重新整理這個網頁。
<span class="en">Speech recognition may be using the wrong mic. Open chrome://settings/content/microphone, pick your real microphone (not EShare/Sharing Audio), then reload.</span>`;
function pickMime(){
  if (!window.MediaRecorder) return '';
  for (const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg']) if (MediaRecorder.isTypeSupported?.(m)) return m;
  return '';
}
function stopAll(){ try{speechSynthesis.cancel()}catch(e){} if(current) current(); }
/** 連續失敗時切換「相容模式」：只用語音辨識，不同時錄音（iPad 上兩個一起用比較容易搶不到麥克風） */
state.srOnly = false; let srFailStreak = 0;
/** listen({continuous, maxMs, onInterim}) → {transcript, blob, mime, srOk, err, peak, diag} */
async function listen(opts={}){
  stopAll();
  // 等朗讀結束，讓 iPad 把聲音切回「錄音」狀態
  const t0=Date.now(); while((ttsBusy || (window.speechSynthesis && speechSynthesis.speaking)) && Date.now()-t0<4000) await new Promise(r=>setTimeout(r,100));
  try{ speechSynthesis.cancel() }catch(e){}
  if (IS_IOS) await new Promise(r=>setTimeout(r,350));

  const useRec = !!window.MediaRecorder && !(state.srOnly && SR);
  let stream=null, recorder=null, chunks=[], mime='', peak=0, meterStop=null;
  if (useRec || !SR){
    stream = await getMic();
    mime = pickMime();
    try{
      recorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data) };
      recorder.start(250);
    }catch(e){ recorder=null }
    // 量音量：知道學生有沒有出聲
    try{
      const ac=audioCtx(), src=ac.createMediaStreamSource(stream), an=ac.createAnalyser(); src.connect(an);
      const buf=new Float32Array(an.fftSize); let on=true;
      (function tick(){ if(!on) return; an.getFloatTimeDomainData(buf); for(const v of buf){ const a=Math.abs(v); if(a>peak) peak=a; } setTimeout(tick,80); })();
      meterStop=()=>{ on=false; try{src.disconnect()}catch(e){} };
    }catch(e){}
  }
  return new Promise(resolve=>{
    let finalText='', interim='', active=true, sr=null, timer, err='';
    const finish=()=>{
      if(!active) return; active=false; current=null; clearTimeout(timer);
      try{ sr && sr.abort ? sr.stop() : sr && sr.stop() }catch(e){}
      const done=()=>{
        meterStop && meterStop(); if(stream) releaseMic(stream);
        const transcript=(finalText+interim).trim();
        const blob = chunks.length ? new Blob(chunks,{type:(recorder&&recorder.mimeType)||mime||'audio/webm'}) : null;
        // 學生有出聲、但辨識沒有結果 → 算一次辨識失敗
        if (SR){
          if (transcript) srFailStreak=0;
          else if (err==='audio-capture' || err==='network' || (stream && peak>0.05)) srFailStreak++;
          if (srFailStreak>=2 && !state.srOnly && IS_IOS){ state.srOnly=true; srFailStreak=0; toast('已切換到 iPad 相容模式 Compatibility mode on',3000); }
        }
        const diag=[DEVICE,BROWSER, state.srOnly?'srOnly':'', err?('err:'+err):'', stream?('peak:'+peak.toFixed(2)):''].filter(Boolean).join(' ');
        resolve({transcript, blob, mime:(recorder&&recorder.mimeType)||mime||'audio/webm', srOk:!!SR, err, peak: stream?peak:null, diag});
      };
      if (recorder && recorder.state!=='inactive'){ recorder.onstop=done; try{ recorder.stop() }catch(e){ done() } } else done();
    };
    current=finish;
    if (SR){
      const startSR=()=>{
        sr=new SR(); sr.lang='zh-TW'; sr.interimResults=true; sr.continuous=!!opts.continuous; sr.maxAlternatives=1;
        sr.onresult=e=>{ interim=''; for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i]; if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript;} opts.onInterim && opts.onInterim(finalText+interim) };
        sr.onerror=e=>{ err=e.error||'error'; if(err==='not-allowed'||err==='service-not-allowed'){ toast('語音辨識被封鎖了 Speech recognition blocked'); } };
        sr.onend=()=>{ if(!active) return;
          if(opts.continuous && err!=='not-allowed' && err!=='service-not-allowed'){ if(finalText||interim){ finalText+=interim; interim=''; } setTimeout(()=>{ if(active){ try{ startSR() }catch(e){ finish() } } },150); }
          else setTimeout(finish,300) };
        try{ sr.start() }catch(e){ err='start-failed'; setTimeout(finish,300) }
      };
      startSR();
    }
    timer=setTimeout(finish, opts.maxMs || 12000);
  });
}

/* ---------- scoring ---------- */
function norm(s){
  return String(s||'')
    .replace(/[\s，。！？、,.!?；;：:「」『』"'…~～\-（）()]/g,'')
    .replace(/[她它妳祂]/g,c=>({她:'他',它:'他',妳:'你',祂:'他'}[c]))
    .replace(/藍球/g,'籃球').replace(/騎車/g,'騎腳踏車').replace(/桌球/g,'乒乓球').replace(/羽球/g,'羽毛球');
}
function lcs(a,b){
  a=[...a]; b=[...b]; const m=a.length,n=b.length; if(!m||!n) return 0;
  let prev=new Array(n+1).fill(0);
  for(let i=1;i<=m;i++){const cur=new Array(n+1).fill(0); for(let j=1;j<=n;j++){cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1])} prev=cur}
  return prev[n];
}
/* 同音字接受表：辨識常把「發音完全一樣」的字聽成別的字（例如 難→男）。
   只在目標句裡有正確的詞時才替換；聲調不同的（例如 打→大）不算對。 */
const HOMO = {
  '難':['男','南','楠'], '有趣':['有去'], '輕鬆':['青松'], '厲害':['利害','歷害','立害'], '覺得':['覺的','決的'],
  '跑步':['跑不'], '做體操':['作體操','坐體操'], '打網球':['打往球'], '打排球':['打牌球'], '玩滑板':['玩華板','完滑板','玩划板'],
  '騎腳踏車':['其腳踏車','奇腳踏車','齊腳踏車'], '跳高':['跳糕'], '衝浪':['沖浪'], '選手':['選首'], '有名':['有明'],
  '參加':['參家','餐加'], '是喔':['是哦','是噢','事喔'], '哦':['喔','噢'], '我也是':['我也事','我也式'],
  '贏':['營','迎','盈'], '輸':['書','叔','舒'], '教練':['叫練','教鍊','叫鍊'], '傳球':['船球'], '游泳':['游涌'],
  '真的嗎':['真得嗎','真的嘛'], '社團':['社糰'], '報名':['抱名'], '舒服':['舒福']
};
function fixHomo(said, target){
  let s=String(said||''); const t=String(target||'');
  for (const [c,alts] of Object.entries(HOMO)) if (t.includes(c)) alts.forEach(a=>{ s=s.split(a).join(c) });
  return s;
}
function scoreText(said,target){
  said = fixHomo(said, target);
  const s=norm(said), t=norm(target);
  if(!s||!t) return 0;
  const l=lcs(s,t);
  const recall=l/[...t].length, precision=l/[...s].length;
  return Math.round(100*Math.min(1, recall*0.85 + precision*0.15));
}
function starsFor(sc){ if(sc==null) return ''; return sc>=85?'⭐⭐⭐':sc>=60?'⭐⭐':sc>=30?'⭐':'' }
function praise(sc){
  if(sc==null) return '錄好了！老師會聽你的錄音。 <span class="en">Recorded! Your teacher will listen.</span>';
  if(sc>=85) return '太棒了！ <span class="en">Excellent!</span>';
  if(sc>=60) return '很好！ <span class="en">Good job!</span>';
  if(sc>=30) return '加油！再試一次。 <span class="en">Nice try! Once more.</span>';
  return '我沒聽清楚，再說一次。 <span class="en">I didn’t catch that. Try again.</span>';
}

  mic.onclick=async()=>{
    if (busy){ current && current(); return; }
    busy=true; mic.classList.add('rec'); mic.textContent='⏹'; txt.textContent='…'; result.innerHTML='';
    let res;
    try{
      res = await listen({continuous:o.continuous, maxMs:o.maxMs, onInterim:t=>{ txt.textContent=t; o.onInterim && o.onInterim(t) }});
    }catch(e){
      busy=false; mic.classList.remove('rec'); mic.textContent='🎤';
      result.innerHTML='🎙️ 沒有麥克風權限。請按網址列的🔒允許麥克風。 <span class="en">Please allow the microphone.</span>';
      return;
    }
    busy=false; mic.classList.remove('rec'); mic.textContent='🎤';
    lastBlob=res.blob; play.classList.toggle('hidden',!lastBlob);
    txt.textContent = res.transcript || (res.srOk?'（沒有聽到 nothing heard）':'（已錄音 recorded）');
    if (res.srOk && !res.transcript){
      const spoke = res.peak!=null && res.peak>0.05;
      result.innerHTML = (spoke
          ? '🤔 有聽到你的聲音，但是沒有辨識出來。再說一次，說清楚一點。 <span class="en">I heard you but couldn’t recognize it. Try again, a bit slower.</span>'
          : '🤔 沒聽到聲音。請靠近麥克風大聲一點再說一次。 <span class="en">No sound heard — speak louder, closer to the mic.</span>') +
        (state.virtualMic ? `<div class="warn" style="margin-top:8px;font-size:15px">${MIC_FIX_HTML}</div>` : '');
      // 有錄到聲音的就存下來（不給分），老師可以聽錄音
      if (res.blob && spoke) saveAttempt({level:o.level, item:o.item, target:o.targetLabel||o.target, transcript:'', score:null, blob:res.blob, mime:res.mime, diag:res.diag, asUser:o.asUser});
      else saveAttempt({level:o.level, item:o.item, target:o.targetLabel||o.target, transcript:'', score:null, blob:null, mime:res.mime, diag:res.diag, noProgress:true, asUser:o.asUser});
      return;
    }
    let sc = null;
    if (res.srOk){ sc = o.score ? o.score(res.transcript) : scoreText(res.transcript, o.target); }
    if (!res.blob && !res.transcript) { result.innerHTML=praise(0); return; }
    result.innerHTML = `<span class="stars">${starsFor(sc)}</span> ${sc!=null?sc+' 分 · ':''}${praise(sc)}`;
    saveAttempt({level:o.level, item:o.item, target:o.targetLabel||o.target, transcript:res.transcript, score:sc, blob:res.blob, mime:res.mime, diag:res.diag, asUser:o.asUser});
    o.onDone && o.onDone(sc, res.transcript);
  };
  return el;
}

/** 回應判斷：'good' 恰當、'bad' 不恰當、'none' 沒說到回應語 */
function judgeReact(t, said){
  const all=(t.good||[]).concat(t.bad||[]).join('');
  const s=norm(fixHomo(said, all));
  if (!s) return 'none';
  if ((t.bad||[]).some(w=>s.includes(norm(w)))) return 'bad';
  if ((t.good||[]).some(w=>s.includes(norm(w)))) return 'good';
  return 'none';
}

      <div class="frames" id="frs" style="margin-top:12px">${topic.frames.map((f,i)=>`<div class="fr" data-i="${i}"><span class="ck">⬜</span><div>${ruby(f.tk)}<span class="en">${esc(f.en)}</span></div></div>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn btn-sky" id="lis">🔊 聽範例 Listen to frames</button><span class="timer" id="tm"></span></div>
      <div class="speak" id="spk"></div>
    </div>`;
  $('#bk').onclick=()=>go('home');
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go('l4',{t:+b.dataset.i}));
  $('#lis').onclick=()=>say(topic.frames.map(f=>S_txt(f.tk.filter(x=>x!=='_'))).join(''));
  const tick=t=>{ const n=norm(t); let k=0; topic.frames.forEach((f,i)=>{ const ok=f.re.test(n); if(ok)k++; const el=app.querySelectorAll('.fr')[i]; el.classList.toggle('ok',ok); el.querySelector('.ck').textContent=ok?'✅':'⬜' }); return k };
  let tmT=null, start=0;
  const spk=mountSpeak($('#spk'),{level:'L4 說一說', item:'L4-'+topic.id, target:topic.name, continuous:true, maxMs:90000,
    onInterim:t=>tick(t),
    score:t=>{ const k=tick(t); const len=[...norm(t)].length; return Math.min(100, Math.round(k/topic.frames.length*80 + Math.min(20, len/3))) },
    onDone:()=>{ clearInterval(tmT); $('#tm').textContent='' }});
  spk.querySelector('.mic').addEventListener('click',()=>{ if(!tmT || !$('#tm').textContent){ start=Date.now(); clearInterval(tmT); tmT=setInterval(()=>{ const s=Math.floor((Date.now()-start)/1000); $('#tm').textContent=`⏱ ${s}s / 90s`; if(s>=90) clearInterval(tmT) },500) } },true);
}

      }
    }});
  setTimeout(()=>say(qText),250);
}

const TIERS = {

};

};

/** 把方塊變成這一句的 tokens（填入運動、名字） */
function lineTokens(line, names){
  const b=BLK[line.b], s=SP[line.s]||SP.lanqiu;
  return b.tk.flatMap(t=>{
    if (t[0]==='{S}') return [st(s)];
    if (t[0]==='{SV}') return [W(s.v[0]+'得', s.v[1]+' de')];
    if (t[0]==='{N}') return [W(names[line.who]||'＿＿','')];
    return [t];
  });
}
const lineText = (line,names)=>S_txt(lineTokens(line,names));
function lineKeys(line){ const b=BLK[line.b]; return b.k.concat(b.hasS? [ (SP[line.s]||SP.lanqiu).kw[0] ] : []); }
function scoreKeys(line, said){
  const t=norm(fixHomo(said, lineKeys(line).join('')+(SP[line.s]?.hz||''))); if(!t) return 0;
  const ks=lineKeys(line), hit=ks.filter(k=>t.includes(norm(k))).length;
  let sc=Math.round(100*hit/ks.length); const model=[...norm(lineText(line,{A:'',B:''}))].length; if([...t].length < Math.min(3, model*0.6)) sc=Math.min(sc,50); return sc;
}

function l6State(){
  const d=store.get(l6Key(),null);
  return Object.assign({tier:'beg', partner:'', topic:'lanqiu', lines:{beg:[],mid:[],adv:[]}, swap:false, cat:'G', nextWho:'A'}, d||{});
}
function l6Save(S){ store.set(l6Key(), S); }

  const tier=S.tier, T=TIERS[tier], adv=tier==='adv';
  const L = S.lines[tier];
  app.innerHTML = `

    <h2 style="font-size:28px;font-weight:900">🧱 對話工作坊 <span class="en" style="font-size:18px">Dialogue Workshop (pairs)</span></h2>

      </div>
      <div class="hint" style="margin-top:6px">${esc(T.desc)} <span class="en">${esc(T.descEn)}</span>
        　話題運動 Topic：<select id="tp">${SPORTS.map(s=>`<option value="${s.id}" ${s.id===S.topic?'selected':''}>${s.e} ${s.hz}</option>`).join('')}</select></div>
    </div>
    <div class="l6grid">
      <div class="card">
        <div class="row" style="justify-content:space-between"><h3 class="dh" style="margin:0">📝 我們的對話 Our dialogue</h3>

        <div id="dlg" class="dlg"></div>
        ${tier!=='beg'?`<div class="row" style="margin-top:8px"><span class="hint">下一句是 Next line:</span><button class="tab ${S.nextWho==='A'?'on':''}" data-nw="A">A</button><button class="tab ${S.nextWho==='B'?'on':''}" data-nw="B">B</button><button class="btn btn-ghost" id="clr" style="padding:6px 12px;font-size:14px;margin-left:auto">🗑️ 清除 Clear</button></div>`:''}

        <button class="btn btn-sun" id="go" style="width:100%;margin-top:12px;font-size:20px">🎙️ 開始說對話 Start speaking ➜</button>
      </div>
      <div class="card">
        <h3 class="dh">🧱 句型方塊 Sentence blocks <span class="hint">點一下加入對話，🔊 先聽</span></h3>
        <div class="tabs">${Object.entries(BCAT).map(([k,c])=>`<button class="tab cat ${c.cls} ${S.cat===k?'on':''}" data-cat="${k}">${c.e} ${c.zh}</button>`).join('')}</div>

  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ S.cat=b.dataset.cat; l6Save(S); app.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('on',x===b)); renderBank(); });

  $('#clr') && ($('#clr').onclick=()=>{ S.lines[tier]=[]; S.nextWho='A'; l6Save(S); viewL6(); });
  $('#playAll').onclick=async()=>{ const btn=$('#playAll'); for(const l of S.lines[tier].filter(l=>l.b)){ if(!document.body.contains(btn)) break; await say(lineText(l,names())); } };

    const cnt=k=>ls.filter(l=>BLK[l.b].cat===k).length;
    const rows=CHECKS[tier].map(([k,n,zh,en])=>{ const v = k==='lines'?ls.length : k==='both'?(ls.some(l=>l.who==='A')&&ls.some(l=>l.who==='B')?1:0) : cnt(k); return {ok:v>=n, zh, en, v, n:k==='both'?null:n}; });
    return {ok:rows.every(r=>r.ok), missing:rows.filter(r=>!r.ok).map(r=>r.zh), missingEn:rows.filter(r=>!r.ok).map(r=>r.en), rows};

    const nm=names();

/* ---------- 說對話（錄音、計分、送給老師） ---------- */
function practiceL6(S, lines, names){
  const tier=S.tier, adv=tier==='adv';
  const partnerUser={name:S.partner, cls:state.user.cls, teacher:state.user.teacher};
  const userOf = who => (names[who]===state.user.name) ? null : partnerUser;   // null = 自己
  const results=[]; let i=0;
  const dlgId = 'D'+Date.now().toString(36);
  function render(){
    if (i>=lines.length) return finish();
    const l=lines[i], nm=names[l.who];
    app.innerHTML = `
      <button class="back" id="bk">← 回去修改對話 Edit dialogue</button>
      <div class="card">
        <div class="row" style="justify-content:space-between"><b>🎙️ 說對話 Speaking</b><span class="hint">第 ${i+1} / ${lines.length} 句 · ${TIERS[tier].zh}</span></div>
        <div class="dots" style="margin:10px 0">${lines.map((x,j)=>`<span class="dot ${j<i?'done':''} ${j===i?'cur':''}"></span>`).join('')}</div>
        <div class="turn spk-bg-${l.who}"><span class="spk spk-${l.who}" style="font-size:22px">${l.who}</span> 輪到 <b>${esc(nm)}</b> 說 <span class="en">${esc(nm)}'s turn</span></div>
        <div class="dline ${BCAT[BLK[l.b].cat].cls}" style="font-size:28px;margin-top:12px">
          <div class="dtxt">${adv? `<span class="kwonly">${BLK[l.b].k.map(esc).join(' … ')}${BLK[l.b].hasS?` · ${SP[l.s].e}${esc(SP[l.s].hz)}`:''}</span><div class="hint">用完整的句子說 Say a full sentence</div>` : ruby(lineTokens(l,names))}</div>
          ${adv?'':`<span class="dact"><button id="ls">🔊</button></span>`}
        </div>
        ${i>0?`<div class="hint" style="margin-top:8px">上一句 ${esc(lines[i-1].who)}：${esc(lineText(lines[i-1],names))}</div>`:''}
        <div class="speak" id="spk"></div>
        <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-ghost" id="skip">跳過 Skip</button><button class="btn btn-sun" id="nx" disabled style="opacity:.5">下一句 Next ➜</button></div>
      </div>`;
    $('#bk').onclick=()=>go('l6');
    $('#ls') && ($('#ls').onclick=()=>say(lineText(l,names)));
    const target=lineText(l,names);
    mountSpeak($('#spk'),{target, level:'L6 對話', item:'L6-line', asUser:userOf(l.who), maxMs:12000,
      targetLabel:`對話${dlgId}｜${TIERS[tier].zh}｜第${i+1}句 ${l.who}：${target}`,
      score: adv ? (t=>scoreKeys(l,t)) : null,
      onDone:(sc,said)=>{ results[i]={who:l.who, target, said, sc}; const nx=$('#nx'); nx.disabled=false; nx.style.opacity=1; }});
    $('#nx').onclick=()=>{ i++; render(); };
    $('#skip').onclick=()=>{ results[i]=results[i]||{who:l.who,target,said:'',sc:null}; i++; render(); };
    if(!adv) setTimeout(()=>say(target),300);
  }
  async function finish(){
    const scored=results.filter(r=>r&&r.sc!=null), avg=scored.length?Math.round(scored.reduce((a,r)=>a+r.sc,0)/scored.length):null;
    const text=lines.map((l,j)=>`${l.who}（${names[l.who]}）：${lineText(l,names)}`).join('\n');
    const said=results.map((r,j)=>r?`${r.who}：${r.said||'（沒說）'}`:'').join(' ／ ');
    const per = who=>{ const rs=results.filter(r=>r&&r.who===who&&r.sc!=null); return rs.length?Math.round(rs.reduce((a,r)=>a+r.sc,0)/rs.length):null; };
    // 作品紀錄：A、B 各存一筆（分數用自己那幾句的平均）
    for (const who of ['A','B']){
      const u=userOf(who);
      await saveAttempt({level:'L6 對話', item:'L6-'+tier, target:`對話${dlgId}｜${TIERS[tier].zh}｜同伴：${names[who==='A'?'B':'A']}\n${text}`, transcript:said, score:per(who), blob:null, mime:'', diag:'', asUser:u});
    }
    app.innerHTML = `
      <div class="card" style="text-align:center">
        <div style="font-size:60px">🎉</div>
        <h2 style="font-size:28px;font-weight:900">對話完成！ Dialogue complete!</h2>
        <div class="kpis" style="justify-content:center">
          <div class="kpi">A ${esc(names.A)}<b>${per('A')??'—'}</b></div>
          <div class="kpi">B ${esc(names.B)}<b>${per('B')??'—'}</b></div>
        </div>
        <div class="hint">✅ 錄音和分數已經送給老師了。 <span class="en">Sent to your teacher.</span></div>
        <div style="text-align:left;margin-top:14px">${lines.map((l,j)=>{const r=results[j]; return `<div class="weakrow"><span class="spk spk-${l.who}">${l.who}</span><div style="flex:1">${esc(lineText(l,names))}<div class="hint">說的：${esc(r?.said||'（沒說）')}</div></div>${r?.sc!=null?`<span class="pill ${r.sc>=85?'p-good':r.sc>=60?'p-mid':'p-low'}">${r.sc}</span>`:''}</div>`}).join('')}</div>
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn btn-sky" id="again">🔄 交換角色再說一次 Swap & again</button>
          <button class="btn btn-ghost" id="edit">✏️ 修改對話 Edit</button>
          <button class="btn btn-ghost" id="home">🏠 回首頁</button>
        </div>
      </div>`;
    $('#again').onclick=()=>{ S.swap=!S.swap; l6Save(S); const nn = S.swap ? {A:S.partner, B:state.user.name} : {A:state.user.name, B:S.partner}; practiceL6(S, lines, nn); };
    $('#edit').onclick=()=>go('l6');
    $('#home').onclick=()=>go('home');
  }
  render();
}

/* ============================================================
   LEVEL 7：對話測驗 — 兩人一組、各自計分；只有關鍵字，沒有句子／拼音／發音
   ============================================================ */
const RUBRIC = [
  ['kw',   '關鍵字運用', 'Uses the keywords'],
  ['full', '句子完整',   'Complete sentences'],
  ['pron', '發音聲調',   'Pronunciation & tones'],
  ['flow', '對話互動',   'Interaction & flow']
];
const RUBRIC_LV = ['1 需要加強','2 部分做到','3 做到','4 很好'];
const TEST_CHECK = [['lines',8,'至少 8 句','At least 8 lines'],['both',1,'兩個人都有說','Both of you speak'],['Q',2,'至少 2 個問句','At least 2 questions'],['R',1,'至少 1 個理由','At least 1 reason'],['E',2,'至少 2 個回應','At least 2 responses'],['I',1,'有邀請或約時間','Invite or set a time']];
/* 關鍵字卡片：同一類別裡關鍵字一樣的方塊只出現一張 */
const KCARDS = (()=>{ const seen=new Set(), out=[]; BLOCKS.forEach(b=>{ const key=b.cat+'|'+b.k.join('/'); if(!seen.has(key)){ seen.add(key); out.push(b); } }); return out; })();

/** 測驗計分：關鍵字 70%＋句子完整 30% */
function testScore(line, said){
  const kw = scoreKeys(line, said);
  const t = [...norm(said||'')];
  const model = [...norm(lineText(line,{A:'',B:''}))].length;   // 參考句的長度（短句像「你好」不會被扣分）
  const comp = t.length >= model*0.7 ? 1 : t.length >= model*0.4 ? 0.5 : 0;
  return Math.round(kw*0.7 + comp*30);
}

function l7Key(){ return 'sp_l7_'+(state.user.teacher||'')+'_'+(state.user.cls||'')+'_'+state.user.name; }
/* 對話測驗卡片上的字：回應＝完整句子，其他＝關鍵字 */
function kwText(b,l){ return b.cat==='E' ? lineText(l,{A:'',B:''}) : b.k.join(' … '); }
/* 對方說了什麼類別 → 建議這一句用什麼類別 */

const L7_CATS = ['G','Q','A','E','R','I'];

        <div class="l7cats" id="cats${w}"></div>
        <div class="bank l7bank" id="bank${w}"></div>
      </div>`;
  app.innerHTML = `
    <button class="back" id="bk">← 回首頁 Home</button>
    <h2 style="font-size:28px;font-weight:900">📝 對話測驗 <span class="en" style="font-size:18px">Dialogue Test (pairs)</span></h2>
    <div class="card" style="padding:12px 18px;margin-top:8px">
      <div class="row" style="gap:16px">
        <span class="who-a">A：${esc(state.user.name)}</span>
        <span class="who-b">B：<input id="pn" value="${esc(S.partner)}" maxlength="20" placeholder="同伴的名字 Partner's name"></span>

/* 浮動計時器：倒數 3 秒後開始錄音＋計時，回傳 {res, used}；取消或沒有麥克風回傳 null */
async function floatTimer(dur){
  const total=dur*1000;
  document.getElementById('tfloat')?.remove();
  const fl=document.createElement('div'); fl.className='tfloat'; fl.id='tfloat';
  fl.innerHTML=`<div class="tring sm" id="ring"><div><div class="tsec" id="sec">3</div><div class="tlab" id="tlab">準備 Ready</div></div></div><div class="trec sm hidden" id="trec"><span class="tdot"></span>錄音中</div><button class="tstop" id="tstop">⏹ 結束<span class="en">Stop</span></button>`;
  document.body.appendChild(fl);
  let cancelled=false, rec=false;
  fl.querySelector('#tstop').onclick=()=>{ if(rec) current && current(); else cancelled=true; };
  for(let n=3;n>0;n--){ if(cancelled||!document.body.contains(fl)) break; fl.querySelector('#sec').textContent=n; await new Promise(r=>setTimeout(r,1000)); }
  if(cancelled||!document.body.contains(fl)){ fl.remove(); return null; }
  fl.querySelector('#tlab').textContent='秒 sec'; fl.querySelector('#trec').classList.remove('hidden');
  const t0=Date.now(); rec=true;
  const iv=setInterval(()=>{ const left=Math.max(0,total-(Date.now()-t0)); const sec=Math.ceil(left/1000); const r=fl.querySelector('#ring');
    fl.querySelector('#sec').textContent=sec; r.style.setProperty('--p',left/total); r.classList.toggle('low',sec<=10); },200);
  let res=null;
  try{ res=await listen({continuous:true, maxMs:total}); }
  catch(e){ clearInterval(iv); fl.remove(); toast('🎙️ 沒有麥克風權限 Please allow the microphone',3000); return null; }
  clearInterval(iv); fl.remove();
  return {res, used: Math.min(dur, Math.round((Date.now()-t0)/1000))};
}

/* ---------- 計時對話：選 30/60/90 秒，按開始後同時計時＋錄下整段對話 ---------- */
const TIMER_OPTS=[30,60,90];
function timedScore(lines, said){
  const t=norm(said||''); if(!t) return 0;
  const keys=lines.map(l=>lineKeys(l));
  let hit=0, tot=0;
  keys.forEach((ks,i)=>{ const fixed=norm(fixHomo(said, ks.join(''))); ks.forEach(k=>{ tot++; if(fixed.includes(norm(k))) hit++; }); });
  return tot? Math.round(100*hit/tot) : 0;
}
async function timedFinish(S, lines, names, res, used, dur, show){
  const partnerUser={name:S.partner, cls:state.user.cls, teacher:state.user.teacher};
  const kwOf=l=>{ const b=BLK[l.b]; return kwText(b,l)+(b.hasS?'＋'+SP[l.s].hz:''); };
  const said=res.transcript||'';
  const sc = res.srOk && said ? timedScore(lines, said) : null;
  const testId='T'+Date.now().toString(36);
  if(show) app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:50px">⏳</div><div class="hint" style="font-size:18px">正在把錄音送給老師… <span class="en">Sending to your teacher…</span></div></div>`;
  for (const who of ['A','B']){
    const text=`測驗${testId}｜同伴：${names[who==='A'?'B':'A']}｜${who}｜計時${dur}秒（說了${used}秒）\n`+lines.map(l=>`${l.who}（${names[l.who]}）［${kwOf(l)}］：（見整段錄音）`).join('\n');
    await saveAttempt({level:'L7 測驗', item:'L7-test', target:text, transcript:said, score:sc, blob:res.blob, mime:res.mime, diag:res.diag, asUser: who==='A'?null:partnerUser});
  }
  store.set(l7Key(), Object.assign({}, S, {lines:[]}));
  if(!show) return;
  const url=res.blob?URL.createObjectURL(res.blob):'';
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:60px">📨</div>
      <h2 style="font-size:28px;font-weight:900">完成！ Done!</h2>
      <div class="hint" style="font-size:16px;margin-top:6px">你們說了 <b>${used}</b> 秒、排了 <b>${lines.length}</b> 句，錄音已經送給老師。 <span class="en">You spoke for ${used} seconds (${lines.length} lines). Your recording was sent to your teacher.</span></div>
      ${url?`<audio controls src="${url}" style="width:100%;margin-top:14px"></audio>`:''}
      <div class="heard" style="text-align:left;margin-top:12px"><span class="lbl">我聽到 I heard:</span><span class="txt">${esc(said)||'（沒有辨識到文字，老師會聽錄音）'}</span></div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-ghost" id="home">🏠 回首頁</button><button class="btn btn-sun" id="again">🔁 再做一次</button></div>
    </div>`;
  $('#home').onclick=()=>go('home'); $('#again').onclick=()=>{ store.set(l7Key(), Object.assign({}, S, {lines:[]})); viewL7(); };
}

function runTest(S, lines, names){
  const partnerUser={name:S.partner, cls:state.user.cls, teacher:state.user.teacher};
  const userOf = who => who==='A' ? null : partnerUser;
  const testId='T'+Date.now().toString(36);
  const results=[]; let i=0;
  function render(){
    if (i>=lines.length) return finish();
    const l=lines[i], b=BLK[l.b], nm=names[l.who];
    app.innerHTML = `
      <div class="card">
        <div class="row" style="justify-content:space-between"><b>📝 對話測驗 Dialogue Test</b><span class="hint">第 ${i+1} / ${lines.length} 句</span></div>
        <div class="dots" style="margin:10px 0">${lines.map((x,j)=>`<span class="dot ${j<i?'done':''} ${j===i?'cur':''}"></span>`).join('')}</div>
        <div class="turn spk-bg-${l.who}"><span class="spk spk-${l.who}" style="font-size:22px">${l.who}</span> 輪到 <b>${esc(nm)}</b> 說 <span class="en">${esc(nm)}'s turn</span></div>
        <div class="dline ${BCAT[b.cat].cls}" style="margin-top:12px"><div class="dtxt"><span class="hint">${BCAT[b.cat].e} ${BCAT[b.cat].zh}</span><br><span class="kwonly" style="font-size:30px">${esc(kwText(b,l))}</span>${b.hasS?` <span style="font-size:24px">${SP[l.s].e} ${esc(SP[l.s].hz)}</span>`:''}</div></div>
        <div class="hint" style="margin-top:6px">${b.cat==='E'?'把這句回應說出來。 <span class="en">Say this response.</span>':'用這些關鍵字說一個完整的句子。 <span class="en">Say a full sentence with these keywords.</span>'}</div>
        ${i>0?`<div class="hint" style="margin-top:8px">上一句 ${esc(names[lines[i-1].who])} 說：「${esc(results[i-1]?.said||'')}」</div>`:''}
        <div class="speak" id="spk"></div>
        <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-ghost" id="skip">跳過 Skip</button><button class="btn btn-sun" id="nx" disabled style="opacity:.5">下一句 Next ➜</button></div>
      </div>`;
    $('#skip').onclick=()=>{ results[i]=results[i]||{who:l.who, kw:kwText(b,l)+(b.hasS?'＋'+SP[l.s].hz:''), said:'', sc:0}; i++; render(); };
    const label=`測驗${testId}｜第${i+1}句 ${l.who}（${nm}）｜關鍵字：${b.k.join('…')}${b.hasS?'＋'+SP[l.s].hz:''}`;
    const sp=mountSpeak($('#spk'),{target:b.k.join('')+(b.hasS?SP[l.s].hz:''), targetLabel:label, level:'L7 測驗', item:'L7-line', asUser:userOf(l.who), maxMs:15000,
      score:t=>testScore(l,t),
      onDone:(sc,said)=>{ results[i]={who:l.who, kw:kwText(b,l)+(b.hasS?'＋'+SP[l.s].hz:''), said, sc};
        const r=sp.querySelector('.result'); if(r) r.innerHTML='✅ 已錄音 Recorded'+(said?'':'（沒有辨識到，可以再說一次）');
        const nx=$('#nx'); nx.disabled=false; nx.style.opacity=1; }});
    $('#nx').onclick=()=>{ i++; render(); };
  }
  async function finish(){
    const per=who=>{ const rs=results.filter(r=>r&&r.who===who&&r.sc!=null); return rs.length?Math.round(rs.reduce((a,r)=>a+r.sc,0)/rs.length):null; };
    for (const who of ['A','B']){
      const mine=lines.map((l,j)=>({l,j,r:results[j]})).filter(x=>x.l.who===who);
      const text=`測驗${testId}｜同伴：${names[who==='A'?'B':'A']}｜${who}\n`+lines.map((l,j)=>`${l.who}（${names[l.who]}）［${results[j]?.kw||''}］：${results[j]?.said||'（沒說）'}`).join('\n');
      await saveAttempt({level:'L7 測驗', item:'L7-test', target:text, transcript:mine.map(x=>x.r?.said||'').join(' ／ '), score:per(who), blob:null, mime:'', diag:'', asUser:userOf(who)});
    }
    store.set(l7Key(), Object.assign({}, S, {lines:[]}));
    app.innerHTML = `
      <div class="card" style="text-align:center">
        <div style="font-size:60px">📨</div>
        <h2 style="font-size:28px;font-weight:900">測驗完成！ Test submitted!</h2>
        <div class="hint" style="font-size:16px;margin-top:6px">你們的錄音已經送給老師，老師會聽完再給分數。 <span class="en">Your recordings were sent to your teacher, who will listen and grade them.</span></div>
        <div style="text-align:left;margin-top:14px">${lines.map((l,j)=>`<div class="weakrow"><span class="spk spk-${l.who}">${l.who}</span><div style="flex:1"><span class="hint">${esc(results[j]?.kw||'')}</span><div>${esc(results[j]?.said||'（沒說）')}</div></div></div>`).join('')}</div>
        <button class="btn btn-ghost" id="home" style="margin-top:14px">🏠 回首頁</button>
      </div>`;
    $('#home').onclick=()=>go('home');
  }
  render();
}

/* 自動任務檢查（看辨識到的整段文字；分不出誰說的，所以是兩個人一起的） */
function sceneChecks(sc, said){
  const t=String(said||'');
  const cnt=re=>(t.match(re)||[]).length;
  const used=sc.words.filter(w=>norm(t).includes(norm(w[0])));
  const rows=[
    ['q',  '至少問 2 個問題', 'Ask at least 2 questions', cnt(/嗎|什麼|為什麼|怎麼樣|幾|哪|誰|會不會|要不要|好不好|難不難|累不累/g)>=2],
    ['r',  '用「因為…」說理由', 'Give a reason with 因為', /因為/.test(t)],
    ['e',  '有回應對方', 'Respond to your partner', /真的|是喔|是哦|我也是|一樣|原來|沒關係|厲害|太好了|好啊/.test(t)],
    ['w',  '用到至少 1 個新詞', 'Use at least 1 new word', used.length>=1]
  ];
  if (sc.invite) rows.push(['i','有邀請或約時間','Invite or set a time',/一起|星期|週末|周末|好不好|要不要|報名|參加/.test(t)]);
  return {rows, used:used.map(w=>w[0]), score: Math.round(100*rows.filter(r=>r[3]).length/rows.length)};
}

function buildBlocks(item, tier){
  const words=item.w.map(t=>({hz:t.split('|')[0], py:(t.split('|')[1]||'').replace(/_/g,' ')}));
  let blocks=[];
  if (tier==='beg'){ let k=0; item.g.forEach(n=>{ const ws=words.slice(k,k+n); k+=n; blocks.push({hz:ws.map(w=>w.hz).join(''), py:ws.map(w=>w.py).join(' ')}); }); }
  else { blocks=words.slice(); (item.x||[]).forEach(t=>blocks.push({hz:t.split('|')[0], py:(t.split('|')[1]||'').replace(/_/g,' '), extra:true})); }
  blocks=blocks.map((b,i)=>Object.assign({k:i},b));
  // 洗牌（但不要剛好是正確順序）
  const ans=item.w.map(t=>t.split('|')[0]).join('');
  for(let n=0;n<8;n++){ for(let i=blocks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [blocks[i],blocks[j]]=[blocks[j],blocks[i]]; } if(blocks.map(b=>b.hz).join('')!==ans) break; }
  return blocks;
}

        el.onpointerdown=e=>{
          if(solved) return; e.preventDefault();
          const k=+el.dataset.k, from=el.dataset.where, sx=e.clientX, sy=e.clientY; let moved=false, ghost=null;
          const move=ev=>{
            if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy)<8) return;
            if(!moved){ moved=true; ghost=el.cloneNode(true); ghost.classList.add('bghost'); document.body.appendChild(ghost); el.classList.add('bdragging'); }
            ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px'; ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+'px';
          };
          const up=ev=>{
            document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
            if(ghost) ghost.remove();
            const cur=placed.indexOf(k);
            if(!moved){ // 點一下：放上去／拿回來
              if(cur>=0) placed.splice(cur,1); else placed.push(k);
            } else {
              const ansBox=$('#ans').getBoundingClientRect();
              const inAns = ev.clientX>=ansBox.left && ev.clientX<=ansBox.right && ev.clientY>=ansBox.top-20 && ev.clientY<=ansBox.bottom+20;
              if(cur>=0) placed.splice(cur,1);
              if(inAns){ // 依照放下的位置插入
                const items=[...$('#ans').querySelectorAll('.bblk.in')].filter(x=>+x.dataset.k!==k);
                let at=items.length;
                for(let i=0;i<items.length;i++){ const r=items[i].getBoundingClientRect(); const rowMid=r.top+r.height/2;
                  if(ev.clientY < r.top-4){ at=i; break; }
                  if(Math.abs(ev.clientY-rowMid)<r.height && ev.clientX < r.left+r.width/2){ at=i; break; } }
                placed.splice(at,0,k);
              }
            }
            $('#fb').textContent=''; draw();
          };
          document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
        };
      });
    }
    draw();
    $('#bk').onclick=()=>go('home');
    app.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{ S.tier=b.dataset.tier; save(); render(); });
    app.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{ S.i=+x.dataset.j; save(); render(); });
    $('#clr').onclick=()=>{ if(solved) return; placed.length=0; $('#fb').textContent=''; draw(); };
    $('#chk').onclick=()=>{
      if(solved) return;
      if(!placed.length){ $('#fb').textContent='先放方塊。 Place some blocks first.'; return; }
      tries++; const s=sentence(); if(tries===1) firstTry=s;
      if(answers.includes(s)){
        solved=true;
        $('#fb').innerHTML=`🎉 <b style="color:var(--grass)">${tries===1?'一次就對了！':'對了！'}</b> <span class="en">${tries===1?'Perfect on the first try!':'Correct!'}</span>`;
        app.querySelectorAll('#ans .bblk').forEach(x=>x.classList.add('good'));
        const full=s+it.end;
        $('#okline').innerHTML=`<div class="pyline">${esc(placed.map(k=>blocks.find(b=>b.k===k).py).join(' '))}</div><div style="font-size:28px;font-weight:900">${esc(full)} <button class="btn btn-ghost" id="say" style="padding:4px 10px;font-size:15px">🔊</button></div><div class="en">${esc(it.en)}</div>`;
        $('#say').onclick=()=>say(full);
        $('#step2').classList.remove('hidden');
        saveAttempt({level:'LB 排句子', item:'LB-'+it.id+'-'+S.tier, target:'排句子（'+(S.tier==='beg'?'初階':'進階')+'）：'+answers[0]+it.end, transcript:firstTry, score: tries===1?100:tries===2?70:40, blob:null, mime:'', diag:'tries:'+tries});
        mountSpeak($('#spk'),{target:full, targetLabel:'排句子：'+full, level:'LB 排句子', item:'LB-'+it.id});
        return;
      }
      // 標出位置不對的方塊
      const ans=it.w.map(t=>t.split('|')[0]); let pos=0, firstBad=-1;
      app.querySelectorAll('#ans .bblk').forEach((x,i)=>{ const b=blocks.find(bb=>bb.k===+x.dataset.k); const ok=!b.extra && ans.join('').indexOf(b.hz,pos)===pos; if(ok) pos+=b.hz.length; else if(firstBad<0) firstBad=i; x.classList.toggle('bad',!ok && firstBad===i); });
      const extraUsed=placed.some(k=>blocks.find(b=>b.k===k).extra);
      const total=it.w.length - (S.tier==='beg'? it.w.length-it.g.length : 0);
      $('#fb').innerHTML = (placed.filter(k=>!blocks.find(b=>b.k===k).extra).length<total ? '還有方塊沒放上去。 Some blocks are missing. ' : '')
        + (extraUsed ? '⚠️ 有一個方塊是多的！ One block doesn’t belong. ' : '')
        + (tries>=2 && firstBad>=0 ? '👀 看看紅色的方塊，從那裡開始改。 Start fixing from the red block.' : '🤔 再想一想順序。 Check the word order.');
    };
    $('#pv').onclick=()=>{ if(S.i>0){ S.i--; save(); render(); } };
    $('#nx').onclick=()=>{ if(S.i<BUILD.length-1){ S.i++; save(); render(); } else go('home'); };
  }
  render();
}

let WORD_ROWS = store.get('sp_words', null) || DEFAULT_WORDS;
async function loadWords(){
  if (!REMOTE) return WORD_ROWS;
  try{ const r=await fetch(`${CONFIG.SCRIPT_URL}?action=words`); const j=await r.json(); if(j.ok && Array.isArray(j.rows) && j.rows.length){ WORD_ROWS=j.rows; store.set('sp_words',j.rows); CATALOG=null; } }catch(e){}
  return WORD_ROWS;
}
function wordBank(){
  const W={}, mine=[], cls=[], others={};
  const me=state.user?nameKey(state.user.name):'';
  WORD_ROWS.forEach(r=>{ const [who,zh,py,en,e,ex,exPy]=r; if(!zh) return;
    const w=W[zh]||(W[zh]={zh,py,en,e:e||'⭐',ex,exPy,owners:[]}); if(!w.ex&&ex){ w.ex=ex; w.exPy=exPy; }
    const k=nameKey(who||'');
    if(!k){ if(!cls.includes(zh)) cls.push(zh); }
    else { if(!w.owners.includes(who)) w.owners.push(who); if(k===me){ if(!mine.includes(zh)) mine.push(zh); } else (others[who]=others[who]||[]).includes(zh)||others[who].push(zh); }
  });
  return {W, mine, cls, others};
}
function wordDone(zh){ const p=getProg(); return (p['LW-'+zh]??-1)>=60 && (p['LW-'+zh+'-s']??-1)>=60; }

          <div class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-sky" id="say1">🔊 聽 Listen</button><button class="btn btn-ghost" id="say1s">🐢 慢慢聽 Slow</button></div></div>

    $('#bk').onclick=()=>renderBank();

    mountSpeak($('#sp1'),{target:zh, targetLabel:'我的詞庫：'+zh, level:'LW 詞庫', item:'LW-'+zh});
    if(w.ex) mountSpeak($('#sp2'),{target:w.ex, targetLabel:'我的詞庫句子：'+w.ex, level:'LW 詞庫', item:'LW-'+zh+'-s', maxMs:15000});
    mountSpeak($('#sp3'),{target:zh, targetLabel:'我的詞庫造句：'+zh, level:'LW 詞庫', item:'LW-'+zh+'-own', maxMs:15000,
      score:t=>{ const n=norm(fixHomo(t,zh)); if(!n) return 0; return (n.includes(norm(zh))?70:20) + ([...n].length>=[...zh].length+4?30:0); }});
    $('#pv').onclick=()=>{ if(i>0) wordPractice(list[i-1], list); };
    $('#nx').onclick=()=>{ if(i<list.length-1) wordPractice(list[i+1], list); else renderBank(); };
  }
}

const CMP_SPORTS=['lanqiu','zuqiu','youyong','paobu','wangqiu','yumao','paiqiu','pingpang','jiaotache','huaban','tiaogao','pashan'];
function cmpSentence(c, kind, a, b){
  const j=x=>x.map(id=>SP[id].hz).join('、');
  if(c.id==='hard') return kind==='same' ? `我跟你一樣，我們都覺得${j(a)}很難。` : `我跟你不一樣。我覺得${j(a)}很難，可是你覺得${j(b)}很難。`;
  return kind==='same' ? `我跟你一樣，我們都${c.verb}${j(a)}。` : `我跟你不一樣。我${c.verb}${j(a)}，可是你${c.verb}${j(b)}。`;
}
function cmpScore(kind, said, sports){
  const t=norm(said||''); if(!t) return 0;
  let sc=0;
  const saysDiff=/不一樣/.test(t), saysSame=!saysDiff && /一樣/.test(t);
  if(kind==='diff' ? saysDiff : saysSame) sc+=40; else if(saysDiff||saysSame) return Math.min(30, sc+20); // 一樣／不一樣說反了
  if(kind==='same' ? /都/.test(t) : /可是|但是|不過/.test(t)) sc+=20;
  const hit=sports.filter(id=>SP[id].kw.some(k=>t.includes(norm(k)))).length;
  sc += sports.length ? Math.round(40*Math.min(1,hit/Math.min(2,sports.length))) : 40;
  return sc;
}

function testSubmissions(rows){

function missingParts(target, said){
  said=fixHomo(said,target);
  const a=[...norm(target)], b=[...norm(said)];
  if(!a.length) return []; if(!b.length) return ['（整句沒說）'];
  const m=a.length,n=b.length, dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(m).fill(false); let i=0,j=0;
  while(i<m&&j<n){ if(a[i]===b[j]){hit[i]=true;i++;j++} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const out=[]; let cur=''; for(let k=0;k<m;k++){ if(!hit[k]) cur+=a[k]; else if(cur){out.push(cur);cur=''} } if(cur) out.push(cur);
  return out;
}
/** 目標句裡學生沒說到的字標紅 */
function diffHTML(target, said){
  said=fixHomo(said,target);
  const tc=[...String(target)], a=[], keep=[];
  tc.forEach((c,i)=>{ const n=norm(c); if(n){ a.push(n); keep.push(i);} });
  const b=[...norm(said)];
  if(!b.length) return `<span class="miss">${esc(target)}</span>`;
  const m=a.length,n=b.length, dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Set(); let i=0,j=0;
  while(i<m&&j<n){ if(a[i]===b[j]){hit.add(keep[i]);i++;j++} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return tc.map((c,k)=> (!norm(c)||hit.has(k)) ? esc(c) : `<span class="miss">${esc(c)}</span>`).join('');
}

/* ---------- 三階段落點、可以挑戰、分數變化 ---------- */
const STAGE_OF = p => (p==='L1'||p==='L2'||p==='LB'||p==='LW') ? 'S' : (p==='L7'||p==='L8') ? 'T' : 'D';
function stageOf(s, gradesList){
  const b={S:[],D:[],T:[]};
  Object.values(s.items).forEach(it=>{ if(it.best==null) return; const p=String(it.id).split('-')[0]; if(/-line$/.test(it.id)) return; b[STAGE_OF(p)].push(it.best); });
  const g=(gradesList||state._grades||[]).filter(x=>nameKey(x.name)===nameKey(s.name) && teacherOf(x)===s.teacher && x.total!=null && x.total!=='').map(x=>Math.round(+x.total/16*100));
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const sA=avg(b.S), dA=avg(b.D), tA=g.length?avg(g):avg(b.T), tN=g.length||b.T.length;
  let stage='S';
  if (tN && tA>=70) stage='T';
  else if ((b.S.length>=8 && sA>=85) || (b.D.length>=3 && dA>=70)) stage='D';
  const done=new Set(Object.keys(s.items));
  const pick=ids=>ids.filter(id=>!done.has(id));
  let ready=false, why='', next=[], nextZh='';
  if (stage==='S' && b.S.length>=5 && sA>=90){ ready=true; why=`第 1–3 關平均 ${sA}`; next=pick(['LD-d1','LD-d2','LD-d7','LS-ball','LS-hand','L3-0']); nextZh='想通：小偵探、分一分'; }
  if (stage==='D' && b.D.length>=5 && dA>=85){ ready=true; why=`第 4–10 關平均 ${dA}`; next=pick(['L7-test','L8-visit','L8-club','L8-reporter']); nextZh='用出來：對話測驗、情境任務'; }
  if (stage==='T' && tA>=85){ ready=true; why=`第 11–12 關 ${tA}`; next=pick(['L8-visit','L8-club','L8-reporter']); nextZh=next.length?'其他情境任務（計時 90 秒）':'計時 90 秒、換同伴再挑戰'; }
  return {stage, sA, dA, tA, sN:b.S.length, dN:b.D.length, tN, ready, why, next, nextZh};
}
function growthOf(s){
  const byItem={}; s.rows.forEach(r=>{ if(r.score===''||r.score==null||/-line$/.test(r.item)) return; (byItem[r.item]=byItem[r.item]||[]).push(r); });
  const ds=[]; let f=0,l=0;
  Object.values(byItem).forEach(a=>{ if(a.length<2) return; a.sort((x,y)=>(+x.time||+x.t)-(+y.time||+y.t)); const first=+a[0].score, last=+a[a.length-1].score; ds.push(last-first); f+=first; l+=last; });
  if(!ds.length) return null;
  return {n:ds.length, delta:Math.round(ds.reduce((x,y)=>x+y,0)/ds.length), first:Math.round(f/ds.length), last:Math.round(l/ds.length)};
}

function analyzeRows(rows){
  const C=catalog(), stu={};
  rows.forEach(r=>{
    const T=teacherOf(r), k=T+'|'+r.cls+'|'+nameKey(r.name); const s=stu[k]||(stu[k]={key:k,name:cleanName(r.name),cls:r.cls,teacher:T,rows:[],items:{},n:0,unrec:0,last:0});
    s.n++; s.last=Math.max(s.last,+r.time||+r.t||0);
    let sc = (r.score===''||r.score==null)?null:+r.score;
    // 舊紀錄用同音字表重新計分（只會往上調）
    if (sc!=null && r.transcript && /^L[12]/.test(String(r.level))){ const re=scoreText(r.transcript, r.target); if(re>sc){ sc=re; r=Object.assign({},r,{score:re, rescored:true}); } }
    if(!r.transcript) s.unrec++;
    s.rows.push(r);
    const it=s.items[r.item]||(s.items[r.item]={id:r.item, n:0, best:null, bestRow:null, lastRow:null});
    it.n++; it.lastRow=r;
    if(sc!=null && (it.best==null || sc>it.best)){ it.best=sc; it.bestRow=r; }
  });
  Object.values(stu).forEach(s=>{
    s.issues=[]; const scored=s.rows.filter(r=>r.score!==''&&r.score!=null);
    s.avg = scored.length ? Math.round(scored.reduce((a,r)=>a+ +r.score,0)/scored.length) : null;
    // heat
    s.heat={};
    Object.values(s.items).forEach(it=>{
      const m=C[it.id]; if(!m || !m.g || it.best==null) return;
      const h=s.heat[m.g]||(s.heat[m.g]={sum:0,c:0}); h.sum+=it.best; h.c++;
      const said=it.bestRow?.transcript||'';
      const push=(type,why)=>s.issues.push({type, item:it.id, label:m.label, best:it.best, said, why});
      if (m.kind==='word' && it.best<60) push('word', `「${m.label}」最高 ${it.best} 分`);
      else if (m.kind==='pattern' && it.best<85){
        const miss=missingParts(m.label, said), keys=PKEY[m.pid]||[];
        const missKey = keys.find(k=>miss.some(f=>f.includes(k)));
        if (missKey) push('pat:'+m.pid, `漏了「${missKey}」`);
        else if (m.word && miss.some(f=>m.word.includes(f) || f.includes(m.word.slice(-2)))) push('word', `說不出「${m.word}」`);
        else push('incomplete', miss.length?`漏了「${miss.slice(0,2).join('、')}」`:`${it.best} 分`);
      }
      else if ((m.kind==='dialog'||m.kind==='react') && it.best<100) push(m.kind, '這一題沒接上');
      else if (m.kind==='q' && it.best<60) push('reading:'+m.qtype, `${it.best} 分`);
      else if ((m.kind==='read'||m.kind==='talk') && it.best<60) push('fluency', `${it.best} 分`);
      else if (m.kind==='order' && it.best<70) push('order', it.best<=40?'試了三次以上才排對':'試了兩次才排對');
      else if (m.kind==='fix' && it.best<60) push('deep:fix', `${DRULE[m.rule]?.[0]||''} ${it.best} 分`);
      else if (m.kind==='reason' && it.best<70) push('deep:reason', it.best<40?'沒有用「因為」說理由':`${it.best} 分`);
      else if (m.kind==='compare' && it.best<70) push('deep:compare', `${it.best} 分`);
    });
    Object.values(s.heat).forEach(h=>h.avg=Math.round(h.sum/h.c));
    s.types={}; s.issues.forEach(x=>{ (s.types[x.type]=s.types[x.type]||[]).push(x) });
    if (s.unrec>=3 && s.unrec/s.n>=0.3) s.types.mic=[{type:'mic', why:`${s.unrec} 次沒辨識到`}];
    s.weakItems = s.issues.slice().sort((a,b)=>a.best-b.best);
  });
  // 練習量：比全班中位數少很多才提醒
  const all=Object.values(stu), ns=all.map(s=>s.n).sort((a,b)=>a-b), med=ns.length?ns[Math.floor(ns.length/2)]:0;
  all.forEach(s=>{
    if (all.length>=3 && s.n < Math.max(5, med*0.4)) s.types.practice=[{type:'practice', why:`只練了 ${s.n} 次（全班中位數 ${med} 次）`}];
    s.needScore = s.issues.length + (s.types.practice?4:0) + (s.types.mic?3:0) + (s.avg!=null && s.avg<60 ? 5 : 0);
  });
  return all;
}

async function loadAssigns(){ // teacher
  if (REMOTE) return (state._assigns||[]);
  return store.get('sp_assigns',[]).filter(a=>a.status!=='cancel');
}
async function postAssign(payload){
  if (REMOTE){
    const r=await fetch(CONFIG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:CONFIG.TEACHER_PIN},payload))});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'failed'); return j;
  }
  const all=store.get('sp_assigns',[]);
  if (payload.action==='assign') payload.targets.forEach(t=>all.push({time:Date.now(),name:t.name,cls:t.cls,teacher:t.teacher,items:payload.items,note:payload.note||'',status:'active'}));
  else all.forEach(a=>{ if(nameKey(a.name)===nameKey(payload.name) && a.cls===(payload.cls||'') && teacherOf(a)===payload.teacher) a.status='cancel' });
  store.set('sp_assigns',all); return {ok:true};
}
async function myAssigns(){ // student
  if (!state.user) return [];
  if (REMOTE){
    try{ const r=await fetch(`${CONFIG.SCRIPT_URL}?action=myAssign&name=${encodeURIComponent(state.user.name)}&cls=${encodeURIComponent(state.user.cls||'')}&teacher=${encodeURIComponent(state.user.teacher||'')}`); const j=await r.json(); return j.assigns||[]; }catch(e){ return [] }
  }
  return store.get('sp_assigns',[]).filter(a=>a.status!=='cancel' && nameKey(a.name)===nameKey(state.user.name) && a.cls===(state.user.cls||'') && teacherOf(a)===(state.user.teacher||CONFIG.LEGACY_TEACHER));
}

/** 打開某一題（派題用） */
function openItem(id){
  let m;
  if ((m=id.match(/^L1-(\w+)-(\w+)$/))){ const si=VOCAB_SETS.findIndex(s=>s.id===m[1]); const i=VOCAB_SETS[si]?.items.findIndex(w=>w.id===m[2]); return go('l1',{set:Math.max(0,si),i:Math.max(0,i)}); }
  if ((m=id.match(/^L2-(.+)$/))){ for(let p=0;p<PATTERNS.length;p++){ const i=PATTERNS[p].items.findIndex(x=>x.id===m[1]); if(i>=0) return go('l2',{p,i}); } }
  if (/^L3-/.test(id)) return go('l3');
  if ((m=id.match(/^L4-(\w+)$/))) return go('l4',{t:Math.max(0,TOPICS.findIndex(t=>t.id===m[1]))});
  if ((m=id.match(/^L5-(\w)-([wpq])(\d+)$/))){ const u=L5.findIndex(x=>x.id===m[1]); const n=+m[3];
    if(m[2]==='w') return go('l5',{u,s:'words',w:n}); if(m[2]==='p') return go('l5',{u,s:'read'}); return go('l5',{u,s:'qs',q:n-1}); }
  if ((m=id.match(/^LD-(\w+)$/))) return go('ld',{i:Math.max(0,DETECT.findIndex(x=>x.id===m[1]))});
  if ((m=id.match(/^LS-(\w+)$/))) return go('ls',{ri:Math.max(0,SORTS.findIndex(x=>x.id===m[1]))});
  if ((m=id.match(/^LC-(\w+)/))) return go('lc',{ci:Math.max(0,COMPARE.findIndex(x=>x.id===m[1]))});
  if ((m=id.match(/^LB-(b\d+)/))) return go('lb',{i:Math.max(0,BUILD.findIndex(x=>x.id===m[1]))});
  if ((m=id.match(/^LW-([^-]+)/))) return go('lw',{zh:m[1]});
  if (/^L6-/.test(id)) return go('l6');
  if (/^L7-/.test(id)) return go('l7');
  if ((m=id.match(/^L8-(\w+)$/)) && SCENE[m[1]]) return sceneView(m[1]);
  go('home');
}

    const allR=S.flatMap(s=>s.rows), scored=allR.filter(r=>r.score!==''&&r.score!=null), avg=scored.length?Math.round(scored.reduce((a,r)=>a+ +r.score,0)/scored.length):'—';

    // class weakest items (by avg of students' best), at least 2 students

      const m=C[it.id]; if(m && (m.kind==='pattern'||m.kind==='word') && it.best<100) missingParts(m.label,it.bestRow?.transcript||'').forEach(f=>b.miss[f]=(b.miss[f]||0)+1); }));
    const weakItems=Object.values(byItem).filter(b=>b.c>=2).map(b=>({...b,avg:Math.round(b.sum/b.c)})).sort((a,b)=>a.avg-b.avg).slice(0,6);
    $('#tb').innerHTML = `
      <div class="kpis">

            return `<div class="needrow" data-k="${esc(s.key)}"><div style="min-width:120px">${stuName(s)}<div class="hint">平均 ${s.avg??'—'}・${s.n} 次</div></div>
              <div style="flex:1">${reasons.map(t=>`<span class="tag">${esc(ISSUE[t].zh)}${s.types[t][0]?.why?`<span class="hint">（${esc(s.types[t][0].why)}${s.types[t].length>1?` 等 ${s.types[t].length} 題`:''}）</span>`:''}</span>`).join('')}</div><span class="hint">›</span></div>` }).join('')
            : '<div class="hint">🎉 這段時間沒有特別需要幫忙的學生。</div>'}
        </div>
        <div class="card">
          <h3 class="dh">📉 全班最弱的題目 <span class="hint">下一堂課可以重點加強</span></h3>
          ${weakItems.length?weakItems.map(b=>{const m=C[b.id]||{}; const top=Object.entries(b.miss).sort((x,y)=>y[1]-x[1]).slice(0,2);
            return `<div class="weakrow"><div style="flex:1"><div style="font-weight:800">${esc(m.label||b.id)}</div><div class="hint">${esc(lvTag(b.id))} · ${b.c} 位學生${top.length?` · 常漏：${top.map(([f,n])=>`「${esc(f)}」×${n}`).join(' ')}`:''}</div></div>${pill(b.avg)}</div>`}).join('')

      + (weakTypes.length?`Areas to work on: ${weakTypes.slice(0,2).map(t=>ISSUE[t].en).join(' and ')}${ex?` — for example, practicing the sentence "${ex.label.replace(/^文文：/,'').replace(/[。！？]$/,'')}" at home`:''}. `:'Performance is consistent across all areas; ready for the challenge level. ')

      <div class="kpis"><div class="kpi">練習次數<b>${s.n}</b></div><div class="kpi">練過題數<b>${Object.keys(s.items).length}</b></div><div class="kpi">平均分數<b>${s.avg??'—'}</b></div><div class="kpi">沒辨識到<b>${s.unrec}</b></div></div>
      <div class="dash2">
        <div class="card">
          <h3 class="dh">💪 強項 Strengths</h3>
          ${strong.length?strong.map(c=>`<div class="weakrow"><div style="flex:1">${esc(c.zh)}</div>${pill(s.heat[c.g].avg)}</div>`).join(''):'<div class="hint">還沒有 85 分以上的部分。</div>'}
          <h3 class="dh" style="margin-top:14px">🧩 需要加強的地方 Needs work</h3>
          ${weakTypes.length?weakTypes.map(t=>`<div class="tag" style="display:block;margin:6px 0">${esc(ISSUE[t].zh)}（${s.types[t].length} 題）<div class="hint">${esc(ISSUE[t].tip)}</div></div>`).join(''):'<div class="hint">🎉 沒有明顯的弱點。</div>'}
          ${s.types.practice?`<div class="tag" style="display:block;margin:6px 0">${ISSUE.practice.zh}（${esc(s.types.practice[0].why)}）</div>`:''}
          ${s.types.mic?`<div class="tag" style="display:block;margin:6px 0">${ISSUE.mic.zh}（${esc(s.types.mic[0].why)}）<div class="hint">${esc(ISSUE.mic.tip)}</div></div>`:''}
        </div>
        <div class="card">
          <h3 class="dh">📌 派題 Assign practice</h3>
          ${A.length?A.map(a=>`<div class="weakrow"><div style="flex:1"><b>${assignDone(s,a)}/${a.items.length} 題完成</b> <span class="hint">${new Date(+a.time).toLocaleDateString('zh-TW')} ${esc(a.note||'')}</span><div class="hint">${a.items.map(id=>esc(C[id]?.label||id)).join('｜')}</div></div></div>`).join('')+`<button class="btn btn-ghost" id="unas" style="padding:8px 14px;font-size:15px">取消這位學生的派題</button>`
            :'<div class="hint">目前沒有派題。</div>'}
          ${weak.length?`<div style="margin-top:12px"><div class="hint">勾選要派的題目：</div>${weak.map((w,i)=>`<label class="ck"><input type="checkbox" value="${esc(w.item)}" ${i<5?'checked':''}> ${esc(w.label)} <span class="hint">（${w.best} 分）</span></label>`).join('')}
            <button class="btn btn-sun" id="asg" style="margin-top:8px">📌 派給 ${esc(s.name)}</button></div>`:''}
        </div>

            return `<tr><td class="hint">${esc(lvTag(w.item))} ${esc(ISSUE[w.type]?.zh||'')}</td><td style="font-size:17px">${tgt!=null?diffHTML(tgt,w.said):esc(m.label||'')}</td><td><b>${esc(w.said)||'<span class="hint">（無辨識）</span>'}</b></td><td>${pill(w.best)}</td><td>${r?.fileId?`<button class="btn btn-ghost" style="padding:6px 12px;font-size:15px" data-f="${esc(r.fileId)}">▶️</button>`:''}</td></tr>`}).join('')}
          </tbody></table>`:'<div class="hint">沒有低分的題目。</div>'}

      const sb=subs[+b.dataset.save], box=$('#tb').querySelector(`.rubric[data-si="${b.dataset.save}"]`);
      const g={testId:sb.id, name:sb.name, cls:sb.cls, teacher:sb.teacher, auto:sb.auto, comment:box.querySelector('[data-k=comment]').value};
      RUBRIC.forEach(([k])=>g[k]=+box.querySelector(`[data-k=${k}]`).value); g.total=RUBRIC.reduce((a,[k])=>a+g[k],0);
      b.textContent='⏳'; try{ await postGrade(g); toast('已儲存評分 Saved'); await refresh(); }catch(e){ b.textContent='💾 儲存評分'; toast('儲存失敗：'+e.message) }
    });
    $('#tb').querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
      b.textContent='⏳';
      try{ const blob=await loadAudio(b.dataset.f); if(!blob) throw new Error('not found'); const a=new Audio(URL.createObjectURL(blob)); await a.play(); b.textContent='🔊'; a.onended=()=>b.textContent='▶️'; }
      catch(e){ b.textContent='⚠️'; toast('無法播放 Cannot play: '+e.message) }
    });
  }

  refresh();
  tAuto=setInterval(()=>{ if(tv.tab==='overview') refresh() }, 60000);
}

/* ---------- boot ---------- */
applyPrefs();
if (REMOTE) flushPending();
go(state.user?'home':'login');
</script>
</body>
</html>
